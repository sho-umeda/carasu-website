# RECRUITIVE Mag（carasu.jp/media/）を、メンバーが ChatGPT で更新した最新版に自動で合わせる。
# 中身は .github/media-sync/sync.py。変わったときだけコミットし、GitHub Pages を作り直す。
# 失敗（取り損ね・公開しない言葉が残っている等）のときは何も変えずに止まり、GitHub がメールで知らせる。
name: media-sync

on:
  schedule:
    - cron: "17 * * * *"   # 1時間ごと（GitHub の混み具合で数分〜十数分遅れることがある）
  workflow_dispatch: {}      # Actions の画面から手で走らせる
  push:
    branches: [main]
    paths:
      - ".github/media-sync/**"
      - ".github/workflows/media-sync.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: media-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow を入れる
        run: pip install --quiet Pillow

      - name: ChatGPT 版を取り込んで整える
        run: python .github/media-sync/sync.py .

      - name: 変わっていればコミットして公開
        id: commit
        run: |
          git add -A media sitemap.xml
          if git diff --cached --quiet; then
            echo "変更なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "carasu-media-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: RECRUITIVE Mag を ChatGPT 版の最新に合わせる"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN での push は Pages の作り直しを起こさないことがあるので、明示的に頼む
      - name: GitHub Pages を作り直す
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
